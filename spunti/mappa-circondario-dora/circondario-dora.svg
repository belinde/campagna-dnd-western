<text x="170.0" y="1006.0" font-size="14" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="170.0" dy="0.0">canneto; ghiaia sotto la riva scavata</tspan>
</text>
<text x="440.0" y="1006.0" font-size="14" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="440.0" dy="0.0">fosso asciutto fin dietro</tspan>
</text>
