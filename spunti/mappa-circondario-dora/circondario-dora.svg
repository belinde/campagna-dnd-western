<tspan x="189.0" dy="0.0">16 NO: Halverson</tspan>
</text>
<text x="189.0" y="338.8" font-size="16" fill="#8c2f22" text-anchor="start" font-weight="normal">
<tspan x="189.0" dy="0.0">baracca dei Phillips, ora occupata</tspan>
</text>
<path d="M142.0 395.0 q 45 -60 90 0" fill="none" stroke="#7a5c3e" stroke-width="2" stroke-dasharray="6 4"/>
<circle cx="167.0" cy="377.0" r="3.5" fill="#f6efe0" stroke="#7a5c3e" stroke-width="1"/>
