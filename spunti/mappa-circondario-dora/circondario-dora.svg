<tspan x="208.0" dy="0.0">torrente — nome? da dove scende?</tspan>
</text>
<path d="M390.0 346.0 S 684.0 542.0, 852.0 654.0 C 992.0 752.0, 1118.0 850.0, 1216.0 931.2" fill="none" stroke="#3b2a1a" stroke-width="2.5" stroke-dasharray="16 6" stroke-linecap="round"/>
