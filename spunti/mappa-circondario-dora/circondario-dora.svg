<text x="58.0" y="219.0" font-size="17" fill="#4f6f7f" text-anchor="start" font-weight="normal">
<tspan x="58.0" dy="0.0">sorgenti?</tspan>
</text>
<path d="M98.8 516.8 C 208.0 480.4, 348.0 455.2, 443.2 430.0" fill="none" stroke="#4f6f7f" stroke-width="2.2" stroke-dasharray="8 7" stroke-linecap="round"/>
