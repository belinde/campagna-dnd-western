<tspan x="974.0" dy="0.0">riva sud: un&#x27;ora abbondante a piedi</tspan>
<tspan x="974.0" dy="20.7">dal paese al podere</tspan>
</text>
<path d="M1258.0 920.0 C 1328.0 885.0, 1370.0 864.0, 1426.0 838.8" fill="none" stroke="#3b2a1a" stroke-width="2.5" stroke-dasharray="16 6" marker-end="url(#freccia)"/>
