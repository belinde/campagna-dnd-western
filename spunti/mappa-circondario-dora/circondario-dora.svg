<text x="1234.0" y="1008.0" font-size="34" fill="#3b2a1a" text-anchor="middle" font-weight="bold">
<tspan x="1234.0" dy="0.0">SILVERADO</tspan>
</text>
<text x="1162.0" y="938.0" font-size="16" fill="#3b2a1a" text-anchor="end" font-weight="normal">
<tspan x="1162.0" dy="0.0">i binari finiscono qui</tspan>
</text>
<text x="1310.0" y="1028.0" font-size="15" fill="#3b2a1a" text-anchor="start" font-weight="normal">
<tspan x="1310.0" dy="0.0">binari e telegrafo, a est</tspan>
</text>
<text x="1110.0" y="220.0" font-size="18" fill="#3b2a1a" text-anchor="start" font-weight="normal">
<tspan x="1110.0" dy="0.0">Silverado</tspan>
<tspan x="1110.0" dy="20.7">· Capolinea: 3 $ a notte, colazione compresa</tspan>
<tspan x="1110.0" dy="20.7">  (Bea; biada e stalla a parte)</tspan>
<tspan x="1110.0" dy="20.7">· Casa dei Registri: Quist, onesto</tspan>
<tspan x="1110.0" dy="20.7">· sceriffo Hale: senza carta non si muove</tspan>
<tspan x="1110.0" dy="20.7">· altre osterie: Filone Magro, Pozzo Profondo</tspan>
</text>
<text x="1110.0" y="400.0" font-size="18" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="1110.0" dy="0.0">La ferrovia, dove proseguirà?</tspan>
<tspan x="1110.0" dy="20.7">a NE verso la Fossa Bianca,</tspan>
<tspan x="1110.0" dy="20.7">o a sud, dove ci sono meno salite?</tspan>
<tspan x="1110.0" dy="20.7">(chiacchiere al Capolinea)</tspan>
</text>
<text x="1110.0" y="520.0" font-size="18" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="1110.0" dy="0.0">Colonia halfling chiusa nel filo</tspan>
<tspan x="1110.0" dy="20.7">spinato di qualcuno: dove?</tspan>
</text>
<text x="1110.0" y="600.0" font-size="18" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="1110.0" dy="0.0">Miniera di ferro, verso le colline:</tspan>
<tspan x="1110.0" dy="20.7">una vena sola, «va sempre peggio»</tspan>
</text>
<path d="M548.8 508.8 l12 -12 l12 12 v10 h-24 z" fill="none" stroke="#3b2a1a" stroke-width="2"/>
<text x="340.0" y="640.0" font-size="18" fill="#3b2a1a" text-anchor="start" font-weight="normal">
<tspan x="340.0" dy="0.0">Carmody, 16 SE: Tom, Nora e cinque figli</tspan>
<tspan x="340.0" dy="20.7">fucile puntato a terra = «buongiorno»</tspan>
<tspan x="340.0" dy="20.7">il lotto è vuoto da 4–5 anni (i Phillips)</tspan>
<tspan x="340.0" dy="20.7">«Garrity vuole solo i soldi»</tspan>
</text>
<path d="M470.0 636.0 Q 527.4 563.4, 554.8 520.8" fill="none" stroke="#3b2a1a" stroke-width="1.2" stroke-dasharray="3 4"/>
<path d="M297.8 270.8 l11 -11 l11 11 v9 h-22 z" fill="none" stroke="#7a5c3e" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="400.0" y="186.0" font-size="17" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="400.0" dy="0.0">Pattinson, 8 SE: la famiglia in regola all&#x27;angolo NO</tspan>
<tspan x="400.0" dy="19.5">(Quist). Casa di legno, il vecchio lavora il legname</tspan>
<tspan x="400.0" dy="19.5">(Carmody). Non ancora visitati</tspan>
</text>
<path d="M410.0 236.0 Q 378.4 231.4, 316.8 256.8" fill="none" stroke="#7a5c3e" stroke-width="1.2" stroke-dasharray="3 4"/>
