<circle cx="207.0" cy="377.0" r="3.5" fill="#f6efe0" stroke="#7a5c3e" stroke-width="1"/>
<text x="147.0" y="425.0" font-size="22" fill="#7a5c3e" text-anchor="start" font-weight="bold">
<tspan x="147.0" dy="0.0">il Pelato?</tspan>
</text>
<text x="70.0" y="560.0" font-size="16" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="70.0" dy="0.0">Bea: oltre il guado, sulle colline a ovest.</tspan>
<tspan x="70.0" dy="18.4">Collina pelata, piena di sassi bianchi</tspan>
<tspan x="70.0" dy="18.4">come i suoi fermaporta. «Vuota»: da lì</tspan>
<tspan x="70.0" dy="18.4">partirono le prime ricerche. Il vecchio Sam</tspan>
<tspan x="70.0" dy="18.4">li portò al mineralogista di allora.</tspan>
</text>
<path d="M200.0 556.0 Q 193.5 478.5, 157.0 431.0" fill="none" stroke="#7a5c3e" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="60" y="760" width="560" height="260" fill="#efe3c6" stroke="#3b2a1a" stroke-width="2"/>
<text x="74.0" y="790.0" font-size="22" fill="#3b2a1a" text-anchor="start" font-weight="bold">
<tspan x="74.0" dy="0.0">Il podere, visto dal canneto</tspan>
</text>
<text x="74.0" y="814.0" font-size="14" fill="#3b2a1a" text-anchor="start" font-weight="normal">
<tspan x="74.0" dy="0.0">Garrity (mezzelfo, cappello rosso, giacca frangiata) + un&#x27;elfa + due umani</tspan>
</text>
<path d="M100 975 Q 340 855, 580 975" fill="none" stroke="#3b2a1a" stroke-width="2"/>
<rect x="310" y="890" width="60" height="32" fill="none" stroke="#3b2a1a" stroke-width="2"/>
