<text x="380.0" y="864.0" font-size="15" fill="#8c2f22" text-anchor="start" font-weight="normal">
<tspan x="380.0" dy="0.0">tiratore sdraiato sulla falda</tspan>
<tspan x="380.0" dy="17.2">nascosta del tetto, col fucile!</tspan>
</text>
<text x="382.0" y="920.0" font-size="14" fill="#3b2a1a" text-anchor="start" font-weight="normal">
<tspan x="382.0" dy="0.0">due solchi freschi:</tspan>
<tspan x="382.0" dy="16.1">altro che «mesi»</tspan>
</text>
