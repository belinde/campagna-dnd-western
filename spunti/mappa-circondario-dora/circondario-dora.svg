<tspan x="40.0" dy="0.0">Circondario di Silverado</tspan>
</text>
<text x="42.0" y="94.0" font-size="20" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="42.0" dy="0.0">rilievo provvisorio — da ripassare a china. D.</tspan>
</text>
<text x="42.0" y="120.0" font-size="17" fill="#7a5c3e" text-anchor="start" font-weight="normal">
<tspan x="42.0" dy="0.0">commissione Brannagh: 4–5 giornate di rilievo ancora da fare</tspan>
</text>
