<text x="530.0" y="292.0" font-size="17" fill="#3b2a1a" text-anchor="start" font-weight="normal">
<tspan x="530.0" dy="0.0">guado sul torrente: largo una decina</tspan>
<tspan x="530.0" dy="19.5">di metri, bassissimo, si passa</tspan>
</text>
<path d="M560.0 318.0 Q 542.0 346.6, 494.0 405.2" fill="none" stroke="#3b2a1a" stroke-width="1.2" stroke-dasharray="3 4"/>
<path d="M425.0 382.8 l14 -14 l14 14 v13 h-28 z" fill="#3b2a1a" opacity="0.85"/>
